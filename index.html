<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>BaaS</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #d0d0d0; border-radius: 8px; box-sizing: border-box; }
        button#mainBtn { background: #007bff; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-weight: 600; cursor: pointer; }
        .post { background: #fff; border: 1px solid #eeeeee; padding: 15px; margin-top: 15px; border-radius: 8px; width: 100%; max-width: 500px; position: relative; }
        .like-btn { cursor: pointer; border: none; background: #f8f9fa; padding: 5px 12px; border-radius: 20px; font-size: 14px; }
        .time { font-size: 11px; color: #999; float: right; }
    </style>
</head>
<body>

<div class="container">
    <h3>Панель управления данными</h3>
    <input type="text" id="name" placeholder="Имя профиля">
    <input type="email" id="email" placeholder="Рабочий Email">
    <button id="mainBtn">Опубликовать в облако</button>
</div>

<div id="feed" style="width: 100%; max-width: 500px;"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
    getFirestore, collection, addDoc, query, orderBy, onSnapshot,
    serverTimestamp, updateDoc, doc, increment
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

// ТВОИ КЛЮЧИ
const firebaseConfig = {
    apiKey: "AIzaSyB9cmkm9COSFiCEZQCllRh_89IYLPbe3TI",
    authDomain: "mycloudapp-60f78.firebaseapp.com",
    projectId: "mycloudapp-60f78",
    storageBucket: "mycloudapp-60f78.firebasestorage.app",
    messagingSenderId: "961637662881",
    appId: "1:961637662881:web:e6c8f35bd316d4e79530e0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// АТОМАРНЫЙ ЛАЙК
window.processLike = async (id) => {
    const docRef = doc(db, "requests", id);
    try {
        await updateDoc(docRef, { likes: increment(1) });
    } catch (e) {
        console.error("Validation Error:", e.message);
    }
};
window.processDislike = async (id) => {
    const docRef = doc(db, "requests", id);
    try {
        await updateDoc(docRef, { dislikes: increment(1) });
    } catch (e) {
        console.error("Ошибка дизлайка:", e.message);
    }
};

window.editRequest = async (id, currentName, currentEmail) => {
    const newName = prompt("Введите новое имя:", currentName);
    if (newName === null) return;

    const newEmail = prompt("Введите новый email:", currentEmail);
    if (newEmail === null) return;

    try {
        const docRef = doc(db, "requests", id);
        await updateDoc(docRef, {
            name: newName,
            email: newEmail
        });
    } catch (e) {
        console.error("Ошибка редактирования:", e.message);
        alert("Не удалось изменить запись.");
    }
};
// ДОБАВЛЕНИЕ ЗАПИСИ
document.getElementById("mainBtn").onclick = async () => {
    const btn = document.getElementById("mainBtn");
    btn.disabled = true;

   try {
    await addDoc(collection(db, "requests"), {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        likes: 0,
        dislikes: 0,
        timestamp: serverTimestamp()
    });
    document.getElementById("email").value = "";
} catch (e) {
        alert("Ошибка безопасности: Данные отклонены сервером.");
    }

    btn.disabled = false;
};

// REAL-TIME СИНХРОНИЗАЦИЯ
const q = query(collection(db, "requests"), orderBy("timestamp", "desc"));

onSnapshot(q, (snapshot) => {
    const feed = document.getElementById("feed");
    feed.innerHTML = "";

    snapshot.forEach((doc) => {
        const data = doc.data();

       feed.innerHTML += `
    <div class="post">
        <span class="time">${data.timestamp?.toDate().toLocaleTimeString() || '--:--'}</span>
        <h3>${data.name}</h3>
        <p>${data.email}</p>
        <button class="like-btn" onclick="processLike('${doc.id}')">👍 ${data.likes || 0}</button>
        <button class="like-btn" onclick="processDislike('${doc.id}')">👎 ${data.dislikes || 0}</button>
        <button class="like-btn" onclick="editRequest('${doc.id}', '${data.name}', '${data.email}')">✏️ Редактировать</button>
    </div>
`;
    });
});
</script>

</body>
</html>
